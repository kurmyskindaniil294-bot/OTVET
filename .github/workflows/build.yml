name: Build Mac App

on: [push, workflow_dispatch]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pillow opencv-python pyinstaller

      - name: Build .app
        run: |
          pyinstaller --onefile --windowed --name LockerMac \
            --add-data "bg.jpg:." \
            --add-data "wan.wav:." \
            --add-data "two.wav:." \
            --add-data "three.wav:." \
            --add-data "four.wav:." \
            --add-data "five.wav:." \
            --add-data "not_end.wav:." \
            --collect-all cv2 --hidden-import cv2 \
            locker_mac.py

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: LockerMac-app
          path: dist/LockerMac.app
